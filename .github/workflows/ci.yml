name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt-and-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable toolchain (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: cargo +nightly fmt --check
        run: cargo +nightly fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: cargo build
        run: cargo build --workspace --all-targets --all-features

      - name: Test — daccord (core library)
        run: cargo test -p daccord --all-features

      - name: Test — daccord-client (SDK)
        run: cargo test -p daccord-client --all-features

      - name: Test — daccord-demo (gRPC service)
        run: cargo test -p daccord-demo --all-features

      - name: Test — integration / consensus correctness
        run: |
          cargo test -p daccord-tests --all-features \
            --test cluster \
            --test multi_paxos \
            --test raft_cluster \
            --test raft_specific \
            --test complex_values \
            --test lifecycle \
            --test larger_clusters \
            --test parity_larger \
            --test algorithm_parity \
            --test safety_invariants

      - name: Test — integration / network simulation
        run: |
          cargo test -p daccord-tests --all-features \
            --test adversarial_cluster \
            --test parity_adversarial \
            --test delayed_cluster \
            --test parity_delayed \
            --test parity_lossy \
            --test parity_reordering \
            --test stress \
            --test parity_stress

      - name: Test — integration / recovery & storage
        run: |
          cargo test -p daccord-tests --all-features \
            --test recovery \
            --test parity_recovery \
            --test duckdb_recovery \
            --test redb_recovery \
            --test benchmark
