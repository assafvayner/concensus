[package]
name = "daccord-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
multi-paxos = ["daccord/multi-paxos"]
duckdb = ["daccord/duckdb"]

[dev-dependencies]
daccord = { path = "../daccord", features = ["channel-transport", "test-support"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
rand = "0.10"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tempfile = "3"
