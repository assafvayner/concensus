[package]
name = "concensus"
version = "0.1.0"
edition = "2021"

[features]
channel-transport = []
tcp-transport = ["tokio/net", "tokio/io-util"]

[dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
