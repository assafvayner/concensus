syntax = "proto3";
package daccord.kv.v1;

// Replicated key-value store built on top of the daccord consensus library.
// Put and Get are both submitted through the consensus log so every node
// applies the same totally-ordered sequence of operations.
service KvService {
  // Insert or replace the value for a key. Returns whether the key was
  // previously absent (was_new = true) or replaced (was_new = false).
  rpc Put (PutRequest) returns (PutResponse);

  // Read the current value for a key. found=false means the key is absent.
  rpc Get (GetRequest) returns (GetResponse);

  // Liveness check.
  rpc Health (HealthRequest) returns (HealthResponse);

  // Detailed node state (algorithm, role, term, etc.).
  rpc Status (StatusRequest) returns (StatusResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}
message PutResponse {
  bool was_new = 1;
}

message GetRequest {
  string key = 1;
}
message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message HealthRequest {}
message HealthResponse {
  string node_name = 1;
  string algorithm = 2;
}

message StatusRequest {}
message StatusResponse {
  string node_id = 1;
  string algorithm = 2;        // "paxos" | "raft"
  string role = 3;             // "follower" | "candidate" | "leader" | "n/a"
  uint64 term = 4;
  string leader_id = 5;
  uint64 log_len = 6;
  optional uint64 commit_index = 7;
  optional uint64 last_applied = 8;
}
