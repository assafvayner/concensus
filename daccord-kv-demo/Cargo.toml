[package]
name = "daccord-kv-demo"
version = "0.1.0"
edition = "2021"

[lib]
name = "daccord_kv_demo"
path = "src/lib.rs"

[[bin]]
name = "daccord-kv-node"
path = "src/node.rs"

[[bin]]
name = "daccord-kv-cli"
path = "src/cli.rs"

[dependencies]
daccord = { path = "../daccord", features = ["tcp-transport", "uds-transport", "redb", "test-support"] }
redb = "4"
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
rand = "0.10"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
daccord = { path = "../daccord", features = ["channel-transport", "tcp-transport", "uds-transport", "redb", "test-support"] }
tempfile = "3"
