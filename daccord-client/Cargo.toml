[package]
name = "daccord-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tonic = "0.12"
prost = "0.13"
bytes = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
thiserror = "1"
tracing = "0.1"

[build-dependencies]
tonic-build = "0.12"

[[example]]
name = "echo"
required-features = []
