[package]
name = "daccord-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tonic = "0.12"
prost = "0.13"
bytes = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
thiserror = "1"
tracing = "0.1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
daccord = { path = "../daccord", features = ["channel-transport", "test-support"] }
daccord-demo = { path = "../daccord-demo", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "echo"
required-features = []
