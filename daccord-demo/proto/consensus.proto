syntax = "proto3";
package consensus;

service ConsensusService {
  rpc Propose (ProposeRequest) returns (ProposeResponse);
  rpc GetDecisions (GetDecisionsRequest) returns (GetDecisionsResponse);
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc Status (StatusRequest) returns (StatusResponse);
}

message ProposeRequest { string value = 1; }
message ProposeResponse { string status = 1; }

message GetDecisionsRequest {
  uint64 start_index = 1;
  optional uint32 limit = 2;  // unset = server default (e.g. 1000)
}
message GetDecisionsResponse { repeated Decision decisions = 1; }

message Decision { uint64 slot = 1; string value = 2; }

message HealthRequest {}
message HealthResponse { string status = 1; }

message StatusRequest {}
message StatusResponse {
  string node_id = 1;
  string algorithm = 2;
  string role = 3;
  uint64 term = 4;
  string leader = 5;
  uint64 log_len = 6;
  bool has_commit_index = 7;
  uint64 commit_index = 8;
  bool has_last_applied = 9;
  uint64 last_applied = 10;
}
