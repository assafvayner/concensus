[package]
name = "daccord-demo"
version = "0.1.0"
edition = "2021"

[lib]
name = "daccord_demo"
path = "src/lib.rs"

[[bin]]
name = "daccord-node"
path = "src/node.rs"

[[bin]]
name = "daccord-cli"
path = "src/cli.rs"

[dependencies]
daccord = { path = "../daccord", features = ["tcp-transport", "uds-transport", "test-support"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
hostname = "0.4"

[features]
multi-paxos = ["daccord/multi-paxos"]
duckdb-bundled = ["daccord/duckdb-bundled"]

[build-dependencies]
tonic-build = "0.12"
