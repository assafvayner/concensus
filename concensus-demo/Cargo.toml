[package]
name = "concensus-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "concensus-node"
path = "src/node.rs"

[[bin]]
name = "concensus-cli"
path = "src/cli.rs"

[dependencies]
concensus = { path = "../concensus", features = ["tcp-transport", "uds-transport", "test-support"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
hostname = "0.4"

[features]
multi-paxos = ["concensus/multi-paxos"]

[build-dependencies]
tonic-build = "0.12"
